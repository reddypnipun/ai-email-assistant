    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- NEW: BASE URL VARIABLE ---
        const API_URL = "https://ai-email-assistant-backend-qkm3.onrender.com";

        function App() {
            const [token, setToken] = useState(localStorage.getItem("jwt") || "");
            
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const [date, setDate] = useState(yesterday.toISOString().split('T')[0]);

            const [inbox, setInbox] = useState([]);
            const [spam, setSpam] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");

            const loadSavedEmails = async () => {
                try {
                    // UPDATED
                    const response = await fetch(`${API_URL}/emails`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    const data = await response.json();
                    if (response.ok && data.emails) {
                        setInbox(data.emails.filter(e => e.status !== 'spam'));
                        setSpam(data.emails.filter(e => e.status === 'spam'));
                    }
                } catch (err) {
                    console.error("Failed to load saved emails", err);
                }
            };

            useEffect(() => {
                if (token) loadSavedEmails();
            }, [token]);

            const syncEmails = async () => {
                setLoading(true);
                setError("");
                
                setInbox([]);
                setSpam([]);

                try {
                    const formattedDate = date.replace(/-/g, "/"); 
                    
                    // UPDATED
                    const response = await fetch(`${API_URL}/sync-emails?date=${formattedDate}`, {
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    
                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.error || "Failed to start streaming");
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = "";

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        
                        buffer = lines.pop(); 
                        
                        for (const line of lines) {
                            if (line.trim()) {
                                const email = JSON.parse(line);
                                
                                if (email.status === 'spam') {
                                    setSpam(prev => {
                                        if (prev.some(e => e.gmail_id === email.gmail_id)) return prev;
                                        return [email, ...prev];
                                    });
                                } else {
                                    setInbox(prev => {
                                        if (prev.some(e => e.gmail_id === email.gmail_id)) return prev;
                                        return [email, ...prev];
                                    });
                                }
                            }
                        }
                    }
                } catch (err) {
                    setError("Network error fetching emails. Ensure backend is running and token is valid.");
                    console.error(err);
                }
                setLoading(false);
            };

            const handleLogout = () => {
                setToken("");
                setInbox([]);
                setSpam([]);
                localStorage.removeItem("jwt");
            };

            const handleAddToCalendar = async (gmail_id) => {
                try {
                    alert("Generating calendar event... this takes a second!");
                    // UPDATED
                    const response = await fetch(`${API_URL}/emails/${gmail_id}/calendar`, {
                        method: "POST"
                    });
                    const data = await response.json();

                    if (data.calendar_url) {
                        window.open(data.calendar_url, '_blank');
                    } else {
                        alert(data.detail || "Could not generate calendar link.");
                    }
                } catch (error) {
                    console.error("Calendar Error:", error);
                    alert("Failed to create calendar event.");
                }
            };

            const handleNotSpam = async (gmail_id) => {
                try {
                    setSpam(prev => prev.filter(e => e.gmail_id !== gmail_id));

                    // UPDATED
                    const response = await fetch(`${API_URL}/emails/${gmail_id}/not-spam`, {
                        method: "PUT"
                    });
                    const data = await response.json();
                    
                    if (data.data) {
                        setInbox(prev => [data.data, ...prev]);
                    }
                } catch (error) {
                    console.error("Spam Rescue Error:", error);
                }
            };

            if (!token) {
                return (
                    <div className="container" style={{ maxWidth: '600px', marginTop: '100px' }}>
                        <div className="card">
                            <h2>Welcome to AI Email Assistant</h2>
                            <p>Please enter your JWT Token from your FastAPI backend to connect:</p>
                            <input 
                                type="text" 
                                className="login-input"
                                value={token} 
                                onChange={(e) => {
                                    setToken(e.target.value);
                                    localStorage.setItem("jwt", e.target.value);
                                }} 
                                placeholder="Paste token here..."
                            />
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <header>
                        <h1>⚡ AI Email Dashboard</h1>
                        <div className="header-controls">
                            <label style={{ fontWeight: 'bold' }}>Fetch After:</label>
                            <input 
                                type="date" 
                                value={date} 
                                onChange={(e) => setDate(e.target.value)} 
                            />
                            <button className="btn-primary" onClick={syncEmails} disabled={loading}>
                                {loading ? "Streaming AI Data..." : "Fetch & Analyze"}
                            </button>
                            <button className="btn-danger" onClick={handleLogout}>
                                Logout
                            </button>
                        </div>
                    </header>

                    {error && <div className="error">{error}</div>}

                    <div className="dashboard">
                        {/* LEFT COLUMN: INBOX */}
                        <div className="column">
                            <h2>Inbox ({inbox.length})</h2>
                            {inbox.map((email, idx) => {
                                const ai = email.ai_analysis || {};
                                return (
                                    <div key={idx} className="card inbox-card">
                                        <div className="card-header">
                                            <span className="priority">Priority: {ai.priority_score || ai.urgency_score || 1}/10</span>
                                            <span className="category">{email.category || ai.category || "Uncategorized"}</span>
                                        </div>
                                        <h3 style={{ margin: '10px 0' }}>{email.subject}</h3>
                                        <p className="sender">From: {email.sender}</p>
                                        
                                        {ai.summary && <p className="summary"><strong>AI Summary:</strong> {ai.summary}</p>}
                                        
                                        {ai.action_items && ai.action_items.length > 0 && (
                                            <div className="action-tasks">
                                                <strong>Tasks:</strong>
                                                <ul style={{ margin: '5px 0', paddingLeft: '20px' }}>
                                                    {ai.action_items.map((item, i) => <li key={i}>{item}</li>)}
                                                </ul>
                                            </div>
                                        )}
                                        
                                        {ai.suggested_reply && (
                                            <div className="suggested-reply">
                                                <strong style={{ display: 'block', fontSize: '0.8rem', color: '#4338ca', marginBottom: '8px' }}>
                                                    ✨ AI Suggested Reply:
                                                </strong>
                                                <span style={{ fontSize: '0.95rem' }}>{ai.suggested_reply}</span>
                                            </div>
                                        )}

                                        {ai.calendar_event && (
                                            <div style={{ marginTop: '15px' }}>
                                                <button
                                                    onClick={() => handleAddToCalendar(email.gmail_id)}
                                                    style={{ backgroundColor: '#2563eb', color: 'white', padding: '8px 12px', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '0.85rem', fontWeight: 'bold' }}
                                                >
                                                    📅 Add to Calendar
                                                </button>
                                            </div>
                                        )}

                                    </div>
                                );
                            })}
                        </div>

                        {/* RIGHT COLUMN: SPAM */}
                        <div className="column">
                            <h2>Blocked by ML ({spam.length})</h2>
                            {spam.map((email, idx) => (
                                <div key={idx} className="card spam-card">
                                    <h3 style={{ margin: '0 0 10px 0' }}>{email.subject}</h3>
                                    <p className="sender">From: {email.sender}</p>
                                    
                                    <div style={{ marginTop: '15px' }}>
                                        <button 
                                            onClick={() => handleNotSpam(email.gmail_id)}
                                            style={{ backgroundColor: '#10b981', color: 'white', padding: '8px 12px', border: 'none', borderRadius: '4px', cursor: 'pointer', fontSize: '0.85rem', fontWeight: 'bold' }}
                                        >
                                            ✅ Mark Not Spam
                                        </button>
                                    </div>

                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
